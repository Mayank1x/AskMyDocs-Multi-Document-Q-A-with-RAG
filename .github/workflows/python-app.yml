name: Python Backend Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock
        
    - name: Setup Dummy DB Connection
      run: |
        # In a real environment, we'd start a postgres service here
        # For fast mocking tests, we mock out psycopg2
        echo "DB_NAME=postgres" >> backend/.env
        echo "DB_USER=postgres" >> backend/.env
        echo "DB_PASSWORD=postgres" >> backend/.env
        
    - name: Test with pytest
      run: |
        cd backend
        # We run the API tests which heavily mock out the DB and LLMs
        pytest tests/test_api.py -v
